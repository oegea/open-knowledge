# Fly.io deployment. Single machine by design: SQLite wants one writer.
# Deploy with `fly deploy --ha=false` so Fly never adds a second machine.
app = 'open-knowledge'
primary_region = 'cdg'

[build]

[env]
  OK_DATA_DIR = '/data'

[mounts]
  source = 'ok_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Cost guard: the machine stops when idle and wakes on the first request
  # (~1s cold start). Compute cost is bounded even under attack.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
